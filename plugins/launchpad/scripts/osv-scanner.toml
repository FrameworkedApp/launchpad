"""

[[IgnoredVulns]]
id = "GHSA-qx49-fqc8-xw99"
ignoreUntil = 2027-01-31
reason = """
MCP Python SDK: the OAuth client (mcp.client.auth) lets the MCP server it
connects to choose where the client's OAuth credentials are sent. Fixed in mcp
1.30.0. Unreachable: semgrep 1.186.0 and 1.187.0 hard-pin mcp==1.29.0. Not
exploitable here: semgrep imports only the MCP server modules (for `semgrep
mcp`, which LaunchPad never runs), nothing in LaunchPad starts an MCP client or
uses MCP OAuth, and no first-party code imports mcp.
"""

[[IgnoredVulns]]
id = "GHSA-mf5v-w3w3-f6cg"
ignoreUntil = 2027-01-31
reason = """
OpenTelemetry Python API: TraceContextTextMapPropagator.extract() parses a
crafted traceparent value with quadratic-time regex backtracking. Fixed in
opentelemetry-api 1.45.2. Unreachable: semgrep 1.186.0 and 1.187.0 pin
opentelemetry-api~=1.37.0, which allows only 1.37.x, alongside matching
~=1.37.0 / ~=0.58b0 pins on the OpenTelemetry SDK, exporter and
instrumentation packages. Not exploitable here: semgrep calls extract() only
on a traceparent it builds from its own SEMGREP_TRACE_PARENT_* environment
variables, LaunchPad runs semgrep with --metrics=off and passes it no inbound
headers, and no first-party code imports opentelemetry.
"""

[[IgnoredVulns]]
id = "GHSA-53pm-wgxf-c6qf"
ignoreUntil = 2027-01-31
reason = """
wcmatch: matching a crafted file name against a pattern with several `*`
wildcards takes polynomial time with default flags. Fixed in wcmatch 11.2.
Unreachable: semgrep 1.186.0 and 1.187.0 pin wcmatch~=8.3. Not exploitable
here: semgrep calls wcmatch only to apply rule `paths:` include/exclude
patterns, and the only ones LaunchPad defines (plugins/launchpad/.semgrep/*.yml;
no .semgrepignore, no CLI --include/--exclude) have at most one single `*` per
path segment, which is not the multi-star shape the advisory needs. File names
are attacker-controlled in a pull request, so this was measured: hostile paths
up to 4 KB (255-byte names, near-miss suffixes, 2000-deep directories) match all
12 expanded patterns in under 4 ms with wcmatch 8.5.2, while the advisory's own
`*_*_*_*_*.csv` shape takes 1.3 s on a 120-byte name. While this entry exists,
tests/test_osv_wcmatch_exposure.py fails if a rule pattern gains several `*` in
one segment, if a .semgrepignore appears, if a semgrep invocation in
lefthook.yml or the workflows passes --include/--exclude or loads a --config
outside plugins/launchpad/.semgrep/, or if hostile paths become slow to match
(each pattern is probed in a subprocess with a hard deadline). v2-handshake-lint
runs it before the semgrep steps on pull requests targeting main or
feat/v2-greenfield-pipeline (the workflow's branch filter), and the full suite
runs it again there; the local pre-push pytest hook runs it only when Python
files change. It is also the reproducible form of the timing probe (semgrep's
own pattern preprocessing and flags). A PR that edits
the rules, the test and the workflow together can still slow only its own CI
job, which `timeout 120` bounds and which runs with a read-only token. No
first-party code imports wcmatch.
"""
